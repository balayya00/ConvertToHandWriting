services:
  - type: web
    name: pdf-handwriting-converter
    env: python
    region: oregon
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --timeout 180 --workers 2 --bind 0.0.0.0:$PORT --preload
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.7
